name: Build Guardian APK

on:
  push:
    paths: ["guardian/**", ".github/workflows/guardian-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-apk
          path: guardian/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: guardian-latest
          name: Guardian (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Debug-signed Guardian APK built from commit ${{ github.sha }}.
            Read the first screen of the app and guardian/README.md before installing.
          files: guardian/app/build/outputs/apk/debug/app-debug.apk
