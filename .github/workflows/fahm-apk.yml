name: Build Fahm APK

# Fahm is a self-contained app that lives in fahm/ (own package id, own signing key, own release tags
# "fahm-v<date>"). This workflow only touches Fahm's files and Fahm's releases.
# It also works unchanged if the folder is moved to the root of its own repository.

on:
  push:
    paths:
      - "fahm/**"
      - ".github/workflows/fahm-apk.yml"
      # the same folders when Fahm lives at the root of its own repository
      - "android/**"
      - "web/**"
      - "tests/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fahm-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder
        run: |
          # fahm/ inside a shared repository, or the repository root when Fahm has its own repo
          if [ -f fahm/android/gradlew ]; then echo "FAHM_DIR=fahm" >> "$GITHUB_ENV"; else echo "FAHM_DIR=." >> "$GITHUB_ENV"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (learning engine, updater)
        working-directory: ${{ env.FAHM_DIR }}
        run: node --test tests/*.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          now=$(date -u +%s)
          # versionCode = minutes since 2025-01-01 (always increases, whichever repo or branch builds it)
          echo "code=$(( (now - 1735689600) / 60 ))" >> "$GITHUB_OUTPUT"
          echo "name=$(date -u -d "@$now" +%y.%m.%d.%H%M)" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.FAHM_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FAHM_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fahm.jks"
            echo "path=$RUNNER_TEMP/fahm.jks" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No signing key::Add the FAHM_KEYSTORE_B64 and FAHM_KEYSTORE_PASSWORD secrets (see fahm/README.md). Without them this run only produces a preview APK that cannot update an installed Fahm, and no release is published."
          fi

      - name: Build APK
        working-directory: ${{ env.FAHM_DIR }}/android
        env:
          FAHM_VERSION_CODE: ${{ steps.ver.outputs.code }}
          FAHM_VERSION_NAME: ${{ steps.ver.outputs.name }}
          FAHM_REPO: ${{ github.repository }}
          FAHM_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          FAHM_KEYSTORE_PASSWORD: ${{ secrets.FAHM_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/fahm.apk"

      - name: Check the signature
        id: sig
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs fahm.apk | tee sig.txt
          fp=$(grep -m1 'certificate SHA-256 digest' sig.txt | awk '{print $NF}')
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      - name: Preview build (no stable signing key)
        if: steps.key.outputs.stable != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fahm-preview-apk
          path: fahm.apk
          retention-days: 7

      - name: Publish release
        if: steps.key.outputs.stable == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fahm-v${{ steps.ver.outputs.name }}
          name: Fahm ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: fahm.apk
          body: |
            Fahm ${{ steps.ver.outputs.name }} — built from commit ${{ github.sha }}.

            **Install:** download `fahm.apk` and open it. Installing over an older Fahm keeps all your progress.
            **Update:** Fahm checks this page for new versions (Me → Updates) and can install them for you.

            Signing certificate SHA-256 (the same for every release):
            `${{ steps.sig.outputs.fingerprint }}`

      - name: Keep the 15 newest Fahm releases
        if: steps.key.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only ever touches releases tagged fahm-v*; other apps' releases are left alone
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("fahm-v"))] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' |
          while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --cleanup-tag --yes
          done

      - name: Summary
        run: |
          {
            echo "### Fahm ${{ steps.ver.outputs.name }}"
            echo "- signing key: \`${{ steps.sig.outputs.fingerprint }}\`"
            if [ "${{ steps.key.outputs.stable }}" = "true" ]; then
              echo "- published as release \`fahm-v${{ steps.ver.outputs.name }}\`"
            else
              echo "- **preview only** (no signing secrets): the APK is in this run's artifacts and cannot update an installed Fahm"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
