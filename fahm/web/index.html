<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF7EE">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src https://audio.qurancdn.com https://everyayah.com https://verses.quran.foundation blob:; connect-src 'self' https://api.github.com">
<title>Fahm</title>
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint so there is no light/dark flash.
  try {
    var s = JSON.parse(localStorage.getItem('fahm.state.v1') || '{}');
    var t = s.settings && s.settings.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div id="app" aria-live="polite"><div class="boot"><div class="boot-mark">فهم</div></div></div>
<noscript>Fahm needs JavaScript to run.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
